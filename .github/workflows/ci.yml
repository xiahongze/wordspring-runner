name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja gcc qt6-base krunner kcmutils kconfig kcoreaddons ki18n sqlite python
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage install
        run: DESTDIR="$PWD/dist/stage" cmake --install build
      - uses: actions/upload-artifact@v4
        with:
          name: wordspring-runner-stage
          path: dist/stage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="wordspring-runner-${GITHUB_REF_NAME}/" -o "dist/wordspring-runner-${GITHUB_REF_NAME}.tar.gz" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
