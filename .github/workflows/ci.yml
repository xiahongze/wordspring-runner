name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  arch:
    name: KRunner on current Arch
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja gcc qt6-base krunner kcmutils kconfig kcoreaddons ki18n sqlite python
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Stage install
        run: DESTDIR="$PWD/dist/stage" cmake --install build
      - uses: actions/upload-artifact@v4
        with:
          name: wordspring-runner-stage
          path: dist/stage

  build:
    name: Build and test (${{ matrix.frontend }})
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - frontend: KDE and CLI
            kde: "ON"
          - frontend: CLI without KDE
            kde: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Install common build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev libsqlite3-dev python3
      - name: Install KDE build dependencies
        if: matrix.kde == 'ON'
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            extra-cmake-modules qt6-qpa-plugins libkf6runner-dev libkf6kcmutils-dev \
            libkf6config-dev libkf6coreaddons-dev libkf6i18n-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DWORDSPRING_BUILD_KDE=${{ matrix.kde }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Verify both release installers and archive contents
        if: matrix.kde == 'ON'
        run: python3 tests/test_packages.py build

  noctalia:
    name: Noctalia manifest and Luau callbacks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Luau tools
        run: |
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.728/luau-ubuntu.zip -o /tmp/luau.zip
          echo 'd3c81eb98c048c118a1fa0b0d3777e52226b5152e2df4f31d1baf660f7f0c115  /tmp/luau.zip' | sha256sum --check
          mkdir /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau /tmp/luau/luau-compile
      - name: Validate plugin and execute callbacks
        run: python3 tests/test_noctalia.py /tmp/luau/luau
      - name: Compile shipping Luau scripts
        run: |
          /tmp/luau/luau-compile --null wordspring/launcher.luau wordspring/panel.luau \
            wordspring/widget.luau wordspring/service.luau wordspring/lib/lookup.luau
      - name: Package architecture-independent plugin
        run: scripts/package-plugin.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: noctalia-plugin
          path: dist/*.tar.gz
          if-no-files-found: error
